name: Java CI
on:
  push:
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Ejecutar pruebas
        run: mvn -B test
